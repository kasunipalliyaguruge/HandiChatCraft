name: Flutter CI
 
on:
  push:
    branches: [ dev ]
  workflow_dispatch:
 
jobs:
  build:
 
    runs-on: ubuntu-latest
 
    step
    - uses: actions/checkout@v2
 
    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
 
    - name: Install Flutter
      uses: subosito/flutter-action@v1
      with:
        flutter-version: '3.19.1'
 
    - name: Get dependencies
      run: flutter pub get
 
    - name: Run tests
      run: flutter test
 
    - name: Build APK
      run: flutter build apk --release
